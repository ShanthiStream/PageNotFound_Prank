<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Page Not Found</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at center, #0f0f1a 0%, #05050a 100%);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      cursor: pointer;
      user-select: none;
    }
    .container {
      text-align: center;
      padding: 3rem 2rem;
      position: relative;
    }
    .glitch-wrapper {
      position: relative;
      display: inline-block;
    }
    .error-code {
      font-size: clamp(8rem, 20vw, 14rem);
      font-weight: 900;
      color: #ff3b5c;
      text-shadow: 4px 4px 0 #ff6b8a, 8px 8px 0 rgba(255, 59, 92, 0.3), 0 0 40px rgba(255, 59, 92, 0.2);
      letter-spacing: -4px;
      line-height: 1;
      animation: glitch 3s ease-in-out infinite;
      position: relative;
    }
    .error-code::before,
    .error-code::after {
      content: "404";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.5;
    }
    .error-code::before {
      color: #00f0ff;
      z-index: -1;
      animation: glitch-offset 2s ease-in-out infinite alternate;
      clip-path: inset(20% 0 60% 0);
    }
    .error-code::after {
      color: #ffeb3b;
      z-index: -2;
      animation: glitch-offset 3s ease-in-out infinite alternate-reverse;
      clip-path: inset(60% 0 10% 0);
    }
    @keyframes glitch {
      0%, 90%, 100% { transform: translate(0); }
      92% { transform: translate(-3px, 2px); }
      94% { transform: translate(3px, -1px); }
      96% { transform: translate(-2px, -2px); }
      98% { transform: translate(2px, 1px); }
    }
    @keyframes glitch-offset {
      0% { transform: translate(-5px, 3px); }
      100% { transform: translate(5px, -3px); }
    }
    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: clamp(1rem, 3vw, 1.5rem);
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-top: 0.5rem;
      font-weight: 300;
    }
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff3b5c, transparent);
      margin: 1.5rem auto;
      border-radius: 2px;
    }
    .description {
      color: rgba(255, 255, 255, 0.4);
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      max-width: 400px;
      line-height: 1.8;
    }
    .description span {
      display: inline-block;
      animation: float 2s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    .scanline {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255, 255, 255, 0.015) 2px, rgba(255, 255, 255, 0.015) 4px);
      pointer-events: none;
      z-index: 999;
    }
    .crt {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0, 0, 0, 0.4) 100%);
      pointer-events: none;
      z-index: 998;
    }
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: #ff3b5c;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      animation: particle-fade 0.8s ease-out forwards;
    }
    @keyframes particle-fade {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(0) translate(var(--dx), var(--dy)); }
    }
    .prank-modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .prank-modal.active {
      opacity: 1;
      pointer-events: all;
    }
    .prank-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
    }
    .prank-card {
      position: relative;
      background: linear-gradient(145deg, #1e1e32, #12121f);
      border: 1px solid rgba(255, 59, 92, 0.3);
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 460px;
      width: 90%;
      text-align: center;
      animation: card-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      box-shadow: 0 0 60px rgba(255, 59, 92, 0.15), inset 0 0 60px rgba(255, 59, 92, 0.03);
    }
    @keyframes card-pop {
      0% { transform: scale(0.8) translateY(30px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .prank-emoji {
      font-size: 4rem;
      margin-bottom: 1rem;
      animation: wiggle 1.5s ease-in-out infinite;
    }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg); }
      40% { transform: rotate(10deg); }
      60% { transform: rotate(-6deg); }
      80% { transform: rotate(4deg); }
    }
    .prank-title {
      font-size: 1.8rem;
      font-weight: 800;
      background: linear-gradient(135deg, #ff3b5c, #ff6b8a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.8rem;
    }
    .prank-text {
      color: rgba(255, 255, 255, 0.7);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 1.5rem;
    }
    .prank-text emoji {
      display: inline-block;
      animation: bounce 1s ease-in-out infinite;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .prank-dismiss {
      background: linear-gradient(135deg, #ff3b5c, #d62d4a);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.9rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 1px;
    }
    .prank-dismiss:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 59, 92, 0.35);
    }
    .prank-dismiss:active {
      transform: translateY(0);
    }
    .cursor-hint {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.15);
      font-size: 0.8rem;
      letter-spacing: 2px;
      animation: pulse-hint 2s ease-in-out infinite;
    }
    @keyframes pulse-hint {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="scanline"></div>
  <div class="crt"></div>

  <div class="container">
    <div class="glitch-wrapper">
      <div class="error-code">404</div>
    </div>
    <div class="subtitle">Page Not Found</div>
    <div class="divider"></div>
    <div class="description">
      <span>👀</span> The page you're looking for doesn't exist.<br>
      Probably lost in the void... <span>🌌</span>
    </div>
  </div>

  <div class="cursor-hint">✦ click anywhere ✦</div>

  <div class="prank-modal" id="prankModal">
    <div class="prank-overlay" id="prankOverlay"></div>
    <div class="prank-card">
      <div class="prank-emoji">🤡🎉</div>
      <div class="prank-title">GOTCHA! 🤪</div>
      <div class="prank-text">
        <emoji>😏</emoji> Don't click me — it's a prank and I <strong style="color:#ff3b5c;font-weight:800;">fooled</strong> you! <emoji>😆</emoji><br><br>
        You really thought there was a page here? <span style="font-size:1.3rem;">💀☠️😂</span>
      </div>
      <button class="prank-dismiss" id="dismissBtn">OKAY, YOU GOT ME 😤</button>
    </div>
  </div>

  <script>
    const body = document.body;
    const modal = document.getElementById('prankModal');
    const overlay = document.getElementById('prankOverlay');
    const dismissBtn = document.getElementById('dismissBtn');

    function spawnParticles(e) {
      const colors = ['#ff3b5c', '#ff6b8a', '#00f0ff', '#ffeb3b', '#a855f7'];
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 120;
        p.style.setProperty('--dx', `${Math.cos(angle) * dist}px`);
        p.style.setProperty('--dy', `${Math.sin(angle) * dist}px`);
        p.style.background = colors[Math.floor(Math.random() * colors.length)];
        p.style.left = e.clientX + 'px';
        p.style.top = e.clientY + 'px';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 800);
      }
    }

    body.addEventListener('click', (e) => {
      spawnParticles(e);
      modal.classList.add('active');
    });

    function closeModal() {
      modal.classList.remove('active');
    }

    overlay.addEventListener('click', closeModal);
    dismissBtn.addEventListener('click', closeModal);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    const errorCode = document.querySelector('.error-code');
    let hue = 348;
    setInterval(() => {
      hue = (hue + 0.3) % 360;
      errorCode.style.textShadow = `4px 4px 0 hsl(${hue}, 100%, 68%), 8px 8px 0 hsla(${hue}, 100%, 60%, 0.3), 0 0 40px hsla(${hue}, 100%, 50%, 0.2)`;
    }, 50);
  </script>
</body>
</html>
